services:
  schedule-bot:
    build: .
    container_name: amsu-schedule-bot
    restart: unless-stopped
    extra_hosts:
      - "api.telegram.org:${TELEGRAM_API_IP:-149.154.167.220}"
    env_file:
      - .env
    environment:
      - TZ=${TIMEZONE:-Asia/Yakutsk}
      - DB_PATH=/app/data/bot_data.db
    volumes:
      # Сохраняем базу данных и связанные WAL/SHM файлы на хосте через монтирование директории
      - ./data:/app/data
      # Монтируем директорию проекта для автоматической миграции старой базы данных при обновлении
      - .:/app/legacy:ro
